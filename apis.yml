aid: an-api-of-ice-and-fire
name: An API of Ice And Fire
description: >-
  An API of Ice And Fire is the world's greatest source for quantified and
  structured data from the universe of A Song of Ice and Fire (and the HBO
  series Game of Thrones). The open, read-only REST API exposes Books,
  Characters, and Houses as hypermedia resources with HAL-style URL references,
  RFC 5988 Link-header pagination, conditional caching, and version selection
  via custom media types. It is free, unauthenticated, and rate-limited at
  20,000 requests per IP per day.

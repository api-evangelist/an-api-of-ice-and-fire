features:
  - name: Hypermedia Resources
    description: >-
      Every resource is returned with absolute `url` self-links and outbound
      URL references to related resources (e.g. characters point to allegiance
      houses, books, and POV books).
  - name: RFC 5988 Link-Header Pagination
    description: >-
      Collection endpoints paginate via Link headers with `first`, `next`,
      `prev`, and `last` rels — no in-body pagination envelope, just
      ready-to-follow URLs.
  - name: Conditional Caching
    description: >-
      Responses include ETag and Last-Modified headers. Clients can issue
      conditional GETs with `If-None-Match` / `If-Modified-Since` and receive
      304 Not Modified to save bandwidth.
  - name: Media-Type Versioning
    description: >-
      Versions are selected via the Accept header, e.g.
      `application/vnd.anapioficeandfire+json; version=1` — resources can
      evolve independently without breaking older clients.
  - name: Rich Filtering
    description: >-
      Characters can be filtered by name, gender, culture, born, died, and
      isAlive; Houses by region, words, hasWords, hasTitles, hasSeats,
      hasDiedOut, hasAncestralWeapons; Books by name, fromReleaseDate,
      toReleaseDate.
  - name: No Authentication
    description: >-
      Fully open read-only API — no API key, no OAuth, no signup. GET only.
  - name: Generous Rate Limit
    description: >-
      20,000 requests per IP per 24 hours, more than enough for most
      hobbyist and demo workloads. 403 Forbidden after exhaustion until the
      window resets.
useCases:
  - name: Learning REST and Hypermedia
    description: >-
      Used in countless tutorials, bootcamps, and university courses to teach
      REST clients, HAL-style hypermedia traversal, Link-header pagination,
      and conditional caching against a real, free, fun dataset.
  - name: Fan Apps and Visualizations
    description: >-
      Powers fan-built web and mobile apps that browse the ASOIAF universe —
      character profiles, house family trees, book timelines, and POV
      explorers.
  - name: API Client Library Examples
    description: >-
      The community has produced helper libraries in Python, Elixir, Haskell,
      Node.js, R, Ruby, Rust, Swift, and a GraphQL wrapper, making the API
      a popular target for "write your own SDK" exercises.
  - name: Game of Thrones Bots and Chat Integrations
    description: >-
      Reddit and Discord bots use the API to answer canon questions about
      characters, houses, and books in real time.
  - name: Data Journalism and Analysis
    description: >-
      Notebooks and data-science demos slice the dataset to study character
      mortality, house power dynamics, and POV distribution across the
      novels.
integrations:
  - name: A Song of Ice and Fire Wiki (canon source)
    description: >-
      The data behind the API is curated against the A Wiki of Ice and Fire
      canon source, kept in sync as new material is published.
  - name: Public APIs Catalog
    description: >-
      Listed in the `public-apis/public-apis` directory under the Video
      category as a free, no-auth fan API.
solutions:
  - name: Self-Hosting
    description: >-
      The full source (ASP.NET / C#) is available under a BSD-style license,
      so teams can fork and self-host their own ASOIAF data API.
  - name: Mirror / Backup
    description: >-
      Because the API is read-only and the dataset is bounded (~12 books,
      ~2,100 characters, ~450 houses), a complete mirror fits in a small
      JSON archive — ideal for offline use and CI test fixtures.
